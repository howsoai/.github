name: Reusable WF - Compile Requirements

on:
  workflow_call:
    inputs:
      upstream-packages:
        description: A whitespace separated list of Howso package dependencies [DEPRECATED].
        type: string
        required: false
      extras:
        description: A whitespace-separated list of Python "extras" that should be installed into requirements-<version>-dev.txt
        type: string
        required: false
        default: "dev"
      branch:
        description: A branch to commit requirements to (defaults to github.head_ref)
        type: string
        required: false
        default: ${{ github.head_ref || github.event.pull_request.head.ref }}
      force-rebuild:
        description: Force a requirements rebuild even if no changes are detected
        type: boolean
        required: false
        default: false
      python-versions:
        description: Space-separated list of Python versions to build requirements for (e.g., "3.9 3.10 3.11")
        type: string
        required: false
        default: "3.11 3.12 3.13 3.14"
      license-python-version:
        description: Python version to use for license generation
        type: string
        required: false
        default: "3.12"
      regen-docs:
        description: For insights-llm repo. Runs `extract_docstrings.py`.
        type: boolean
        required: false
        default: false
      build-system:
        description: The build system specified in pyproject.toml (affecting requirements generation) [e.g., use "hatch" for Hatch]
        type: string
        required: false
        default: "setuptools"
      constraints-file:
        description: >-
          Path, relative to the repository root, of a pip constraints file passed with -c to every
          requirements-<version>[-dev].txt compile. Use python_version environment markers to give
          each Python version its own constraints. Affects only the generated lockfiles, never the
          package metadata. Supported with the setuptools and uv build systems.
        type: string
        required: false
        default: ""
      lock-format:
        description: >-
          Lockfile format to generate. "requirements" compiles a requirements-<version>.txt and
          requirements-<version>-dev.txt per entry in python-versions. "pylock" compiles a single
          pylock.toml with uv against Artifactory (when its secrets are available) and PyPI, covering every Python version from the lowest entry in
          python-versions upward, every platform, and the runtime dependencies plus every extra in
          extras; it regenerates only when a fingerprint of those inputs changes, keeps existing pins
          unless force-rebuild is set, and removes any requirements-<version>[-dev].txt files. The
          pylock format requires static dependencies in pyproject.toml and does not support build-system
          hatch. When empty, the caller's PYTHON_LOCK_FORMAT Actions variable is used, else "requirements".
        type: string
        required: false
        default: ""

jobs:
  check-requirements:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      dev_req_file: ${{ steps.detect-changes.outputs.dev-req-file }}
      changes: ${{ steps.detect-changes.outputs.changes || steps.detect-pylock-changes.outputs.changes }}
      lock-format: ${{ steps.lock-format.outputs.format }}
      inputs-hash: ${{ steps.detect-pylock-changes.outputs.inputs-hash }}
    steps:

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve lock format
        id: lock-format
        env:
          LOCK_FORMAT: ${{ inputs.lock-format || vars.PYTHON_LOCK_FORMAT || 'requirements' }}
        run: |
          if [[ "$LOCK_FORMAT" != "requirements" && "$LOCK_FORMAT" != "pylock" ]]; then
            echo "::error::lock-format must be 'requirements' or 'pylock', got '$LOCK_FORMAT'"
            exit 1
          fi
          echo "Lock format: $LOCK_FORMAT"
          echo "format=$LOCK_FORMAT" >> "$GITHUB_OUTPUT"

      - name: Check for pylock.toml input changes
        id: detect-pylock-changes
        if: steps.lock-format.outputs.format == 'pylock'
        env:
          CONSTRAINTS_FILE: ${{ inputs.constraints-file }}
          BUILD_SYSTEM: ${{ inputs.build-system }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          EXTRAS: ${{ inputs.extras }}
        run: |
          if [[ ! -e "pyproject.toml" ]]; then
            echo "::error::lock-format pylock requires a pyproject.toml"
            exit 1
          fi
          if [[ "$BUILD_SYSTEM" == "hatch" ]]; then
            echo "::error::lock-format pylock is not supported with build-system hatch"
            exit 1
          fi
          if [[ -n "$CONSTRAINTS_FILE" && ! -f "$CONSTRAINTS_FILE" ]]; then
            echo "::error::constraints-file '$CONSTRAINTS_FILE' does not exist"
            exit 1
          fi

          # Fingerprint every input that affects the resolution. pylock.toml records the fingerprint
          # it was compiled from, so a matching fingerprint means pylock.toml is up to date.
          export PYTHON_FLOOR=$(tr ' ' '\n' <<< "$PYTHON_VERSIONS" | grep . | sort -V | head -n1)
          inputs_hash=$(python3 - <<'EOF'
          import hashlib, json, os, sys, tomllib

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f).get("project", {})
          dynamic = {"dependencies", "optional-dependencies"} & set(project.get("dynamic", []))
          if dynamic:
              print(f"::error::lock-format pylock requires static {', '.join(sorted(dynamic))} in pyproject.toml", file=sys.stderr)
              sys.exit(1)
          constraints = None
          if constraints_file := os.environ["CONSTRAINTS_FILE"]:
              with open(constraints_file) as f:
                  constraints = f.read()
          inputs = {
              "dependencies": project.get("dependencies", []),
              "optional-dependencies": project.get("optional-dependencies", {}),
              "requires-python": project.get("requires-python"),
              "extras": os.environ["EXTRAS"].split(),
              "python-floor": os.environ["PYTHON_FLOOR"],
              "constraints": constraints,
          }
          print(hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest())
          EOF
          )
          echo "Inputs fingerprint: $inputs_hash"

          changes=""
          if [[ ! -f pylock.toml ]]; then
            changes="pylock.toml does not exist"
          elif [[ "$(sed -n 's/^# inputs-sha256: //p' pylock.toml | head -n1)" != "$inputs_hash" ]]; then
            changes="pylock.toml was compiled from different inputs"
          elif [[ -n "$(find . -maxdepth 1 -name 'requirements-[0-9]*.txt' -print -quit)" ]]; then
            changes="requirements-<version>[-dev].txt files are present alongside pylock.toml"
          fi
          if [[ -n "$changes" ]]; then
            echo "pylock.toml needs regenerating: $changes"
          else
            echo "pylock.toml is up to date."
          fi
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          echo "inputs-hash=$inputs_hash" >> "$GITHUB_OUTPUT"

      - name: Check for requirements changes
        id: detect-changes
        if: steps.lock-format.outputs.format == 'requirements'
        env:
          CONSTRAINTS_FILE: ${{ inputs.constraints-file }}
          BUILD_SYSTEM: ${{ inputs.build-system }}
        run: |
          # Determine which type of requirements/setup file exists in this repo
          if [ -e "pyproject.toml" ]; then
            echo "Found pyproject.toml"
            req_file="pyproject.toml"
          elif [ -e "requirements.in" ]; then
            echo "Found requirements.in"
            req_file="requirements.in"
            if [ -e "requirements-dev.in" ]; then
              dev_req_file="requirements-dev.in"
            fi
          else
            echo "No requirements.in or pyproject.toml found!"
            exit 1
          fi

          # Validate the constraints file configuration
          if [[ -n "$CONSTRAINTS_FILE" ]]; then
            if [[ "$BUILD_SYSTEM" == "hatch" ]]; then
              echo "::error::constraints-file is not supported with build-system hatch"
              exit 1
            fi
            if [[ ! -f "$CONSTRAINTS_FILE" ]]; then
              echo "::error::constraints-file '$CONSTRAINTS_FILE' does not exist"
              exit 1
            fi
          fi

          # Warn if setup.py is used (should migrate to pyproject.toml)
          if [ -e "setup.py" ]; then
            echo "::warning file=setup.py::Please update to a pyproject.toml"
          fi

          # Check for changes in the requirements files on the current branch compared to default branch
          git fetch
          git status
          diff_paths=("$req_file")
          if [[ -n "$CONSTRAINTS_FILE" ]]; then
            diff_paths+=("$CONSTRAINTS_FILE")
          fi
          changes=$(git diff "origin/${{ github.event.repository.default_branch }}" --name-only -- "${diff_paths[@]}")

          if [[ ! -n "$changes" ]]; then
            # Requirements.txt missing entirely?
            if [ -z "$(find . -maxdepth 1 -name 'requirements-*.txt' -print -quit)" ]; then
              echo "Requirements.txt does not exist!"
              changes="no requirements.txt"
            fi
          fi

          # Don't rebuild if the last commit was a requirements rebuild
          # Check if the last commit modified requirements files (not just an empty commit)
          LAST_COMMIT_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          if [[ "${{ github.actor }}" == "dmglennie-diveplane" || "${{ github.actor }}" == "HowsoAndrew" ]]; then
            echo "Last commit by bot, checking if it modified requirements..."
            if echo "$LAST_COMMIT_FILES" | grep -qE "requirements-.*\.txt|LICENSE-3RD-PARTY\.txt"; then
              echo "Requirements were generated in the last commit!"
              unset changes
            else
              echo "Last commit by bot but didn't modify requirements (probably empty trigger commit)"
            fi
          fi

          # Also don't rebuild if there was a previous rebuild at all
          echo "event_name: ${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" && -n "$changes" ]]; then
            PR_NUMBER=$(echo "${{ github.ref }}" | sed 's/refs\/pull\/\([0-9]*\)\/merge/\1/')
            
            echo "Parsing PR #$PR_NUMBER for automated requirements commits..."
            
            # Use GitHub API to check each commit's files
            COMMITS_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/commits)
            
            # Use process substitution to avoid subshell
            while read commit_sha; do
              echo "Checking commit $commit_sha..."
              
              # Get commit details including files changed
              COMMIT_DATA=$(gh api repos/${{ github.repository }}/commits/$commit_sha)
              
              COMMIT_AUTHOR=$(echo "$COMMIT_DATA" | jq -r '.commit.author.name')
              COMMIT_MESSAGE=$(echo "$COMMIT_DATA" | jq -r '.commit.message' | head -n1)
              
              echo "  Author: $COMMIT_AUTHOR"
              echo "  Message: $COMMIT_MESSAGE"
              
              # Check if this looks like a bot/automation commit
              if [[ "$COMMIT_AUTHOR" == *"bot"* || "$COMMIT_AUTHOR" == *"automation"* || "$COMMIT_MESSAGE" == *"equirements"* ]]; then
                echo "  Bot/automation commit detected, checking files..."
                
                # Get list of files changed in this commit
                FILES_CHANGED=$(echo "$COMMIT_DATA" | jq -r '.files[].filename')
                echo "  Files changed:"
                echo "$FILES_CHANGED"
                
                # Check if requirements files were modified
                if echo "$FILES_CHANGED" | grep -qE "requirements-.*\.txt|LICENSE-3RD-PARTY\.txt"; then
                  echo "  ✓ Found previous requirements rebuild in commit $commit_sha; skipping rebuild."
                  unset changes
                  break
                fi
              fi
            done < <(echo "$COMMITS_JSON" | jq -r '.[].sha')
          fi

          if [ -n "$changes" ]; then
            echo "Changes found in $req_file on branch ${{ inputs.branch }}."
          else
            echo "No changes to $req_file detected on ${{ inputs.branch }}."
          fi

          echo "dev-req-file: $dev_req_file"

          echo "changes=$(echo $changes)" >> $GITHUB_OUTPUT
          echo "dev-req-file=$(echo $dev_req_file)" >> $GITHUB_OUTPUT

  compile-requirements:
    needs: ['check-requirements']
    if: needs.check-requirements.outputs.changes != '' || inputs.force-rebuild == true
    runs-on: platform-ubuntu-runner-small
    permissions: write-all
    env:
      GH_TOKEN: ${{ github.token }}
    steps:

      - uses: actions/checkout@v6
        with:
          # Check out with a PAT so that the workflow can make commits that re-trigger the PR build
          token: ${{ secrets.HOWSOAI_WORKFLOW_AUTOMATION_TOKEN }}
          ref: ${{ inputs.branch }}

      - name: Set up Python (pylock)
        if: needs.check-requirements.outputs.lock-format == 'pylock'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.license-python-version }}

      - name: Compile pylock.toml
        if: needs.check-requirements.outputs.lock-format == 'pylock'
        env:
          CONSTRAINTS_FILE: ${{ inputs.constraints-file }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          EXTRAS: ${{ inputs.extras }}
          FORCE_REBUILD: ${{ inputs.force-rebuild }}
          INPUTS_HASH: ${{ needs.check-requirements.outputs.inputs-hash }}
          UV_INDEX_JFROG_USERNAME: ${{ secrets.ARTIFACTORY_ACCESS_USER }}
          UV_INDEX_JFROG_PASSWORD: ${{ secrets.JFROG_ACCESS_TOKEN }}
        run: |
          git pull
          python -m pip install "uv<1.0"
          python_floor=$(tr ' ' '\n' <<< "$PYTHON_VERSIONS" | grep . | sort -V | head -n1)
          args=(pyproject.toml --universal --python-version "$python_floor" -o pylock.toml)
          # Artifactory and PyPI are searched together for the highest matching version of each
          # package, as pip does; Artifactory also holds unrelated old versions of some PyPI package
          # names. Its credentials come from the UV_INDEX_JFROG_* variables, so the index URL written
          # into pylock.toml carries none.
          if [[ -n "$UV_INDEX_JFROG_PASSWORD" ]]; then
            args+=(--index "jfrog=https://dpbuild.jfrog.io/artifactory/api/pypi/pypi-edge/simple" --index-strategy unsafe-best-match)
          fi
          for extra in $EXTRAS; do
            args+=(--extra "$extra")
          done
          if [[ -n "$CONSTRAINTS_FILE" ]]; then
            args+=(-c "$CONSTRAINTS_FILE")
          fi
          # uv keeps the pins already in pylock.toml wherever they still satisfy the inputs;
          # force-rebuild re-resolves everything to the newest allowed versions
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            args+=(--upgrade)
          fi
          uv pip compile "${args[@]}"
          # Record the inputs fingerprint that the check-requirements job compares against
          { echo "# inputs-sha256: $INPUTS_HASH"; grep -v '^# inputs-sha256:' pylock.toml; } > pylock.toml.new
          mv pylock.toml.new pylock.toml
          if [[ -n "$UV_INDEX_JFROG_PASSWORD" ]] && grep -qF "$UV_INDEX_JFROG_PASSWORD" pylock.toml; then
            echo "::error::pylock.toml contains the Artifactory access token; refusing to commit it"
            exit 1
          fi
          # pylock.toml is the only lockfile in this format
          rm -f requirements-[0-9]*.txt

      - name: Generate third-party licenses (pylock)
        if: needs.check-requirements.outputs.lock-format == 'pylock'
        run: |
          rm -f ./LICENSE-3RD-PARTY.txt
          # The license file covers the runtime dependencies (project.dependencies) and their dependencies
          python - > "$RUNNER_TEMP/runtime.in" <<'EOF'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print("\n".join(tomllib.load(f)["project"].get("dependencies", [])))
          EOF
          if [[ -z "$(grep -v '^\s*$' "$RUNNER_TEMP/runtime.in")" ]]; then
            echo "No runtime dependencies in pyproject.toml."
            exit 0
          fi
          python -m venv "$RUNNER_TEMP/licenses"
          venv_bin="$RUNNER_TEMP/licenses/bin"
          "$venv_bin/python" -m pip install --upgrade pip
          if [[ -n "${{ secrets.JFROG_ACCESS_TOKEN }}" ]]; then
            export PIP_EXTRA_INDEX_URL="https://${{ secrets.ARTIFACTORY_ACCESS_USER }}:${{ secrets.JFROG_ACCESS_TOKEN }}@dpbuild.jfrog.io/artifactory/api/pypi/pypi-edge/simple"
          fi
          # Constrain the runtime install to the versions pylock.toml pins for this Python
          "$venv_bin/python" - pylock.toml > "$RUNNER_TEMP/pylock-pins.txt" <<'EOF'
          import sys
          try:
              import tomllib
          except ImportError:
              from pip._vendor import tomli as tomllib
          try:
              from packaging.markers import Marker
          except ImportError:
              from pip._vendor.packaging.markers import Marker

          # Print name==version for every package in the pylock.toml at argv[1] whose marker matches this
          # interpreter and platform, reading only the file. pip is left out.
          with open(sys.argv[1], "rb") as f:
              packages = tomllib.load(f)["packages"]
          for package in packages:
              if package["name"] == "pip" or "version" not in package:
                  continue
              marker = package.get("marker")
              if marker is None or Marker(marker).evaluate({"extra": ""}):
                  print(f"{package['name']}=={package['version']}")
          EOF
          "$venv_bin/python" -m pip install -r "$RUNNER_TEMP/runtime.in" -c "$RUNNER_TEMP/pylock-pins.txt"
          # Do not include Howso software in the 3rd party license file
          "$venv_bin/python" -m pip uninstall amalgam-lang howso-engine howso-synthesizer howso-validator howso-validator-enterprise howso-visuals howso-openapi-client -y
          "$venv_bin/python" -m pip install pip-licenses
          "$venv_bin/pip-licenses" --with-authors --with-urls --with-license-file --with-description --format=plain-vertical > ./LICENSE-3RD-PARTY.txt

      - name: Compile requirements (setuptools|uv)
        if: needs.check-requirements.outputs.lock-format == 'requirements' && (inputs.build-system == 'setuptools' || inputs.build-system == 'uv')
        id: compile-requirements-setuptools
        env:
          CONSTRAINTS_FILE: ${{ inputs.constraints-file }}
        run: |
          # Pull latest changes
          git pull
          # Install pyenv & Python build dependencies
          sudo apt update; sudo apt install build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev curl libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev -y
          echo "Installing pyenv"
          curl https://pyenv.run | bash
          export PYENV_ROOT="$HOME/.pyenv"
          
          echo "PYENV_ROOT=$HOME/.pyenv" >> $GITHUB_ENV
          echo "$PYENV_ROOT/bin" >> $GITHUB_PATH
          echo "$PYENV_ROOT/shims" >> $GITHUB_PATH
          command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"
          eval "$(pyenv init -)"
          # Collect the pip constraints argument, if a constraints file is configured
          constraint_args=()
          if [[ -n "$CONSTRAINTS_FILE" ]]; then
            constraint_args=(-c "$CONSTRAINTS_FILE")
            echo "Applying lockfile constraints from $CONSTRAINTS_FILE:"
            cat "$CONSTRAINTS_FILE"
          fi
          # Compile requirements
          IFS=' ' read -r -a versions <<< "${{ inputs.python-versions }}"
          for version in "${versions[@]}"; do
            echo "Installing Python $version"
            # Install Python
            pyenv install $version
            pyenv local $version
            python --version
            # Later versions of pip break pip requirements generation
            python -m pip install pip==25.2

            if [[ "${{ inputs.build-system }}" == "uv" ]]; then
              proc="uv pip compile"
              # uv doesn't use --resolver or --allow-unsafe; --no-emit-index-url is supported.
              # pip is left out of the output so a pinned pip installed with --user cannot
              # shadow the runner's pip and break its `pip` console script.
              args="--no-emit-index-url --no-emit-package pip"
              # Must install it
              python -m pip install "uv<1.0"
            else
              # Install pip-tools and run pip-compile
              pip install -U pip-tools==7.4.1
              proc=pip-compile
              # --unsafe-package pip makes pip the only "unsafe" package, so setuptools is
              # pinned normally and pip is written as a comment rather than a pin. A pinned
              # pip installed with --user would shadow the runner's pip and break its `pip`
              # console script whenever the two versions use different entry points.
              args="--resolver=backtracking --no-emit-index-url --unsafe-package pip"
            fi

            bash -l
            # Set extra index URL
            if [[ -n "${{ secrets.JFROG_ACCESS_TOKEN }}" ]]; then
              export PIP_EXTRA_INDEX_URL="https://${{ secrets.ARTIFACTORY_ACCESS_USER }}:${{ secrets.JFROG_ACCESS_TOKEN }}@dpbuild.jfrog.io/artifactory/api/pypi/pypi-edge/simple"
            fi
            if [[ "${{ needs.check-requirements.outputs.dev_req_file }}" == "requirements-dev.in" ]]; then
              cat requirements.in
              $proc requirements.in --upgrade $args "${constraint_args[@]}" -o requirements-$version.txt -v
              $proc requirements-dev.in requirements.in --upgrade $args "${constraint_args[@]}" -o requirements-$version-dev.txt -v
            else
              # uv pip compile requires an explicit source file; pip-compile auto-discovers pyproject.toml
              if [[ "${{ inputs.build-system }}" == "uv" ]]; then
                compile_src="pyproject.toml"
              else
                compile_src=""
              fi
              $proc $compile_src --upgrade $args "${constraint_args[@]}" -o requirements-$version.txt -vv
              # Check to see if any requirements were actually generated; don't commit "empty" requirements files
              if [[ $(wc -l <requirements-$version.txt) -le 7 ]]; then
                cat requirements-$version.txt
                echo "Removing empty requirements-$version.txt as it is empty."
                rm -f requirements-$version.txt
              fi
              # Generate dev/other extras requirements (pyproject.toml only)
              if [[ -e "pyproject.toml" ]]; then
                extras=""
                for extra in ${{ inputs.extras }}; do
                  extras+="--extra $extra "
                done
                echo "Got extras: $extras"
                # Only generate dev requirements if there are extras
                if [[ -n "$extras" ]]; then
                  $proc $compile_src $extras --upgrade $args "${constraint_args[@]}" -o requirements-$version-dev.txt -vv
                fi
              fi
            fi
          done

      - name: Generate third-party licenses (setuptools)
        if: needs.check-requirements.outputs.lock-format == 'requirements' && (inputs.build-system == 'setuptools' || inputs.build-system == 'uv')
        id: gen-licenses-setuptools
        run: |
          which python
          eval "$(pyenv init -)"
          # Install the lockfile on the Python it was compiled for: its pins can carry
          # python_version markers (from constraints-file) that skip packages on other Pythons.
          pyenv install --skip-existing ${{ inputs.license-python-version }}
          pyenv local ${{ inputs.license-python-version }}
          # Later versions of pip break pip requirements generation
          python -m pip install pip==25.2
          python --version
          pip list
          rm -f ./LICENSE-3RD-PARTY.txt
          # Set extra index URL
          if [[ -n "${{ secrets.JFROG_ACCESS_TOKEN }}" ]]; then
            export PIP_EXTRA_INDEX_URL="https://${{ secrets.ARTIFACTORY_ACCESS_USER }}:${{ secrets.JFROG_ACCESS_TOKEN }}@dpbuild.jfrog.io/artifactory/api/pypi/pypi-edge/simple"
          fi
          if [[ -e "requirements-${{ inputs.license-python-version }}.txt" ]]; then
            python -m pip install -r requirements-${{ inputs.license-python-version }}.txt --no-deps
          else
            echo "No main requirements.txt file found."
            exit 0
          fi
          # Do not include Howso software in the 3rd party license file
          pip uninstall amalgam-lang howso-engine howso-synthesizer howso-validator howso-validator-enterprise howso-visuals howso-openapi-client -y
          pip install pip-licenses
          pip-licenses --with-authors --with-urls --with-license-file --with-description --format=plain-vertical  > ./LICENSE-3RD-PARTY.txt

      - name: Set up Python
        if: needs.check-requirements.outputs.lock-format == 'requirements' && inputs.build-system == 'hatch'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile requirements (hatch)
        if: needs.check-requirements.outputs.lock-format == 'requirements' && inputs.build-system == 'hatch'
        id: compile-requirements-hatch
        run: |
          # Pull latest changes
          git pull
          # Later versions of pip break pip requirements generation
          python -m pip install pip==24.2
          # Install Hatch
          pip install click==8.0.4
          pip install hatch==1.14.1
          # Set extra index URL
          if [[ -n "${{ secrets.JFROG_ACCESS_TOKEN }}" ]]; then
            export PIP_EXTRA_INDEX_URL="https://${{ secrets.ARTIFACTORY_ACCESS_USER }}:${{ secrets.JFROG_ACCESS_TOKEN }}@dpbuild.jfrog.io/artifactory/api/pypi/pypi-edge/simple"
          fi
          # Install pip-tools
          pip install -U pip-tools==7.4.1
          # Compile requirements
          hatch run freeze:freeze 

      - name: Generate third-party licenses (hatch)
        if: needs.check-requirements.outputs.lock-format == 'requirements' && inputs.build-system == 'hatch'
        id: gen-licenses-hatch
        run: |
          rm -f ./LICENSE-3RD-PARTY.txt
          # Set extra index URL
          if [[ -n "${{ secrets.JFROG_ACCESS_TOKEN }}" ]]; then
            export PIP_EXTRA_INDEX_URL="https://${{ secrets.ARTIFACTORY_ACCESS_USER}}:${{ secrets.JFROG_ACCESS_TOKEN }}@dpbuild.jfrog.io/artifactory/api/pypi/pypi-edge/simple"
          fi
          if [[ -e "requirements-${{ inputs.license-python-version }}.txt" ]]; then
            python -m pip install -r requirements-${{ inputs.license-python-version }}.txt --no-deps
          else
            echo "No main requirements.txt file found."
            exit 0
          fi
          # Do not include Howso software in the 3rd party license file
          pip uninstall amalgam-lang howso-engine howso-synthesizer howso-validator howso-validator-enterprise howso-visuals howso-openapi-client -y
          pip install pip-licenses
          hatch run licenses:licenses
          sed -i 's/^[^ ]*\/site-packages\///' LICENSE-3RD-PARTY.txt

      - name: Regen docs
        if: inputs.regen-docs == true
        run: |
          python --version
          python extract_docstrings.py

      - name: Commit changes
        id: commit-changes
        env:
          LOCK_FORMAT: ${{ needs.check-requirements.outputs.lock-format }}
        run: |
          git pull
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes to pip requirements or third-party licenses detected. Making a new commit..."
            git config user.name "howso-automation"
            git config user.email "support@howso.com"
            git add *.txt
            if [[ "$LOCK_FORMAT" == "pylock" ]]; then
              git add pylock.toml
              git ls-files -z --deleted -- 'requirements-[0-9]*.txt' | xargs -0 -r git rm --quiet --cached --
            fi
            if [[ "${{ inputs.regen-docs }}" == "true" ]]; then
              git add main/docstrings/*.json
            fi
            git commit -m "Automated requirements/license generation"
            git push
          else
            echo "No changes detected in the repository."
          fi
